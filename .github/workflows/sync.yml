name: Sync NewsBreak data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-newsbreak-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync
        env:
          NEWSBREAK_TOKEN_VINI: ${{ secrets.NEWSBREAK_TOKEN_VINI }}
          NEWSBREAK_TOKEN_PRETORIAN: ${{ secrets.NEWSBREAK_TOKEN_PRETORIAN }}
          NEWSBREAK_TOKEN_NEIA: ${{ secrets.NEWSBREAK_TOKEN_NEIA }}
          NEWSBREAK_TOKEN_ALAN: ${{ secrets.NEWSBREAK_TOKEN_ALAN }}
          REDTRACK_API_KEY: ${{ secrets.REDTRACK_API_KEY }}
        run: python3 scripts/sync.py

      - name: Commit and push if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add e18176716ee60c8f/data.json
          git diff --staged --quiet || git commit -m "Sync data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
